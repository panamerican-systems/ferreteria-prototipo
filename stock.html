<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrelectrica - Catálogo</title>
    <!-- Favicon Dinámico -->
    <link id="logo-store" rel="icon" href="assets/images/general/logo.png" type="image/png">
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- ========================================== -->
    <!-- 1. ENCABEZADO Y NAVEGACIÓN (HEADER)        -->
    <!-- ========================================== -->
    <header id="main-header" class="bg-white shadow-md sticky top-0 z-30 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <!-- Nombre de la Tienda y Logotipo -->
            <div class="flex items-center space-x-3">
                <img src="assets/images/general/logo.png" alt="Ferrelectrica Logo" class="w-10 h-10 object-contain rounded-md">
                <div>
                    <h1 id="store-name" class="font-bold text-xl leading-tight text-gray-900">Ferrelectrica</h1>
                </div>
            </div>

            <!-- Botón del Carrito de Compras / Calculadora POS -->
            <button id="cart-btn" class="relative bg-gray-900 text-white p-2.5 rounded-full hover:bg-gray-800 transition flex items-center justify-center">
                <img src="assets/images/icons/cart-fill.svg" alt="Carrito de compras" class="w-6 h-6 filter invert">
                <span id="cart-counter" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-6 w-full space-y-8">

        <!-- ========================================== -->
        <!-- 2. BUSCADOR GLOBAL Y FILTROS               -->
        <!-- ========================================== -->
        <section class="max-w-xl mx-auto">
            <div class="flex items-center gap-2">
                <!-- Buscador -->
                <div class="relative flex-grow">
                    <input type="text" id="global-search" placeholder="Buscar productos, paquetes..." class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition text-sm">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <!-- Botón de Agotados -->
                <button id="filter-agotados-btn" class="bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 font-semibold px-4 py-2.5 rounded-lg text-sm transition whitespace-nowrap shadow-sm">
                    ⚠️ Próximos / Agotados
                </button>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- 3. GALERÍAS Y CATÁLOGO DINÁMICO           -->
        <!-- ========================================== -->
        
        <!-- Sección 1: Productos -->
        <section id="sec-productos" class="space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800">Productos</h2>
                <div class="flex items-center space-x-2">
                    <button id="prev-prod" class="p-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-40 disabled:cursor-not-allowed">❮</button>
                    <span id="page-prod" class="text-xs font-semibold text-gray-600">1 / 1</span>
                    <button id="next-prod" class="p-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-40 disabled:cursor-not-allowed">❯</button>
                </div>
            </div>
            <div id="grid-productos" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Se llenará dinámicamente desde JavaScript -->
            </div>
        </section>

        <!-- Sección 2: Combos (Antes Paquetes) -->
        <section id="sec-paquetes" class="space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800">Combos</h2>
                <div class="flex items-center space-x-2">
                    <button id="prev-paq" class="p-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-40 disabled:cursor-not-allowed">❮</button>
                    <span id="page-paq" class="text-xs font-semibold text-gray-600">1 / 1</span>
                    <button id="next-paq" class="p-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-40 disabled:cursor-not-allowed">❯</button>
                </div>
            </div>
            <div id="grid-paquetes" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Se llenará dinámicamente desde JavaScript -->
            </div>
        </section>

        <!-- Sección 3: Promociones -->
        <section id="sec-promociones" class="space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800">Promociones</h2>
                <div class="flex items-center space-x-2">
                    <button id="prev-promo" class="p-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-40 disabled:cursor-not-allowed">❮</button>
                    <span id="page-promo" class="text-xs font-semibold text-gray-600">1 / 1</span>
                    <button id="next-promo" class="p-1 rounded bg-gray-200 hover:bg-gray-300 disabled:opacity-40 disabled:cursor-not-allowed">❯</button>
                </div>
            </div>
            <div id="grid-promociones" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Se llenará dinámicamente desde JavaScript -->
            </div>
        </section>

    </main>

    <!-- ========================================== -->
    <!-- 4. MODAL CARRITO ESTILO TICKET / POS      -->
    <!-- ========================================== -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 flex justify-end hidden">
        <div class="bg-white w-full max-w-md h-full flex flex-col justify-between p-6 shadow-2xl font-mono border-l-2 border-black">
            
            <!-- Cabecera del Ticket -->
            <div>
                <div class="flex justify-between items-center border-b-2 border-black pb-3">
                    <h2 id="ticket-store-name" class="font-bold text-lg uppercase tracking-wider">BOLETA DE VENTA</h2>
                    <button id="close-cart-btn" class="text-xl font-bold hover:text-gray-600">✕</button>
                </div>
                
                <!-- Sanitización Input Nombre -->
                <div class="mt-4">
                    <label class="block text-xs font-bold uppercase mb-1">Cliente:</label>
                    <input type="text" id="client-name" placeholder="Tu Nombre y Apellido" class="w-full border-b-2 border-black py-1 px-2 focus:outline-none text-sm uppercase">
                    <p id="name-error" class="text-xs text-red-600 hidden mt-1">Solo se permiten letras y espacios.</p>
                </div>

                <!-- Detalle de Ítems -->
                <div class="mt-6 border-b-2 border-dashed border-gray-400 pb-2">
                    <p class="text-xs font-bold flex justify-between uppercase">
                        <span>Cant. / Producto</span>
                        <span>Subtotal</span>
                    </p>
                </div>
                <div id="cart-items-list" class="max-h-60 overflow-y-auto my-2 divide-y divide-gray-200">
                    <!-- Ítems agregados dinámicamente -->
                </div>
            </div>

            <!-- Pie del Ticket / Envío o Cobro Interno -->
            <div class="border-t-2 border-black pt-4 space-y-4">
                <div class="flex justify-between items-center text-base font-bold">
                    <span>TOTAL:</span>
                    <span id="cart-total">$ 0.00</span>
                </div>
                <button id="send-order-btn" class="w-full bg-black text-white font-bold py-3 uppercase tracking-wider hover:bg-gray-800 transition">
                    Enviar Pedido por WhatsApp
                </button>
            </div>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- 5. MODAL DE DETALLES DE PRODUCTO          -->
    <!-- ========================================== -->
    <div id="product-detail-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white max-w-md w-full rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh] relative animate-fade-in">
            
            <!-- Botón Cerrar (Tache 'X') -->
            <button id="close-detail-modal-btn" class="absolute top-3 right-3 bg-black/50 hover:bg-black text-white w-8 h-8 rounded-full flex items-center justify-center font-bold z-10 transition">
                ✕
            </button>

            <!-- Imagen del Producto -->
            <div class="relative h-56 bg-gray-100">
                <img id="detail-modal-img" src="" alt="" class="w-full h-full object-cover">
                <div id="detail-modal-badges" class="absolute top-3 left-3 flex flex-col gap-1"></div>
            </div>

            <!-- Cuerpo del Modal -->
            <div class="p-5 flex-grow overflow-y-auto space-y-3">
                <h3 id="detail-modal-title" class="font-bold text-lg text-gray-900 leading-snug"></h3>
                <p id="detail-modal-price" class="text-xl font-extrabold text-gray-900"></p>
                <hr class="border-gray-100">
                <div class="space-y-1">
                    <h4 class="text-xs font-bold uppercase text-gray-400">Descripción</h4>
                    <p id="detail-modal-description" class="text-sm text-gray-600 leading-relaxed whitespace-pre-line"></p>
                </div>
            </div>

            <!-- Pie del Modal con Acción de Agregar -->
            <div class="p-4 bg-gray-50 border-t border-gray-100 flex items-center justify-end">
                <button id="detail-modal-add-btn" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed transition text-sm">
                    Agregar al Carrito
                </button>
            </div>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- 6. SCRIPTS DE LA APLICACIÓN               -->
    <!-- ========================================== -->
    <script src="config.js"></script>
    <script src="js/sheets-fetcher.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
